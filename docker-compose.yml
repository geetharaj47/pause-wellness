version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pause_postgres
    environment:
      POSTGRES_USER: pause_app
      POSTGRES_PASSWORD: pause_secure_local_dev
      POSTGRES_DB: pause_wellness
    ports:
      - "5432:5432"
    volumes:
      - pause_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pause_app -d pause_wellness"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pause_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://pause_app:pause_secure_local_dev@db:5432/pause_wellness}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PAUSE_JOURNAL_ENCRYPTION_KEY=${PAUSE_JOURNAL_ENCRYPTION_KEY}
      - ENABLE_EXTERNAL_MODEL_PROVIDER=false
      - ENABLE_DEMO_ACCOUNT=${ENABLE_DEMO_ACCOUNT:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pause_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pause_pgdata:
