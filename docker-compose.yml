version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindtrace_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist SQLite databases and allow hot reloading during development
      - ./backend:/backend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindtrace_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
