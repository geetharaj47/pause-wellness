services:
  # ==============================================================================
  # 1. FastAPI Backend API Service (Local-first ML, RAG, Privacy & Safety Routing)
  # ==============================================================================
  - type: web
    name: pause-api
    runtime: python
    region: oregon
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pause-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PAUSE_JOURNAL_ENCRYPTION_KEY
        generateValue: true
      - key: ENABLE_EXTERNAL_MODEL_PROVIDER
        value: "false"
      - key: ENABLE_DEMO_ACCOUNT
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: PREFER_LIGHTWEIGHT_MODELS
        value: "false"

  # ==============================================================================
  # 2. Next.js 14 Frontend Application (Tailwind CSS, Client UI, Consent-First)
  # ==============================================================================
  - type: web
    name: pause-web
    runtime: node
    region: oregon
    plan: free
    branch: master
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: pause-api
          property: host
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: pause-api
          property: host

databases:
  # ==============================================================================
  # 3. Private PostgreSQL Database (pgvector extension enabled)
  # ==============================================================================
  - name: pause-db
    databaseName: pause_wellness
    user: pause_app
    region: oregon
    plan: free
    ipAllowList: [] # Private network only: access restricted to Render services
